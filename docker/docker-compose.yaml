services:
  app:
    image: beginor/net-core-app:amd64
    platform: linux/amd64
    ports:
      - 5050:5050
    volumes:
      - ./config:/app/config
      - ./log:/app/log
      - ./cache:/app/cache
      - ./storage:/app/storage
    environment:
      TZ: Asia/Shanghai
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5050
      ASPNETCORE_PATHBASE: /net-core-app
      DATABASE_CONNECTION: "server=127.0.0.1;port=5432;database=net_core_app;user id=postgres;password=pgsql@18;"
    restart: unless-stopped
networks:
  default:
    external: true
    name: compose
